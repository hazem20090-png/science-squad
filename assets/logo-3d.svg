<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 720" role="img" aria-labelledby="title desc">
  <title id="title">Science Squad animated 3D logo</title>
  <desc id="desc">شعار Science Squad ثلاثي الأبعاد مع ذرة ودورق وكتاب متحرك</desc>
  <defs>
    <radialGradient id="badge" cx="46%" cy="35%" r="70%"><stop stop-color="#164e82"/><stop offset=".38" stop-color="#082955"/><stop offset=".72" stop-color="#03142f"/><stop offset="1" stop-color="#01050e"/></radialGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#d5fdff"/><stop offset=".24" stop-color="#31f1ff"/><stop offset=".58" stop-color="#00bfe9"/><stop offset="1" stop-color="#006b9c"/></linearGradient>
    <linearGradient id="yellow" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#fffbd1"/><stop offset=".22" stop-color="#fff028"/><stop offset=".62" stop-color="#ffbe00"/><stop offset="1" stop-color="#f06a00"/></linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#fff"/><stop offset=".48" stop-color="#edf9ff"/><stop offset="1" stop-color="#a9c9e6"/></linearGradient>
    <linearGradient id="paperTurn" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff"/><stop offset=".45" stop-color="#d8f6ff"/><stop offset="1" stop-color="#7fb6dc"/></linearGradient>
    <linearGradient id="badgeShine" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff" stop-opacity=".3"/><stop offset=".45" stop-color="#35e8ff" stop-opacity=".06"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
    <filter id="deep" x="-40%" y="-40%" width="180%" height="180%"><feDropShadow dx="0" dy="16" stdDeviation="13" flood-color="#000" flood-opacity=".8"/><feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#12c9e8" flood-opacity=".24"/></filter>
    <filter id="textDepth" x="-30%" y="-30%" width="180%" height="180%"><feDropShadow dx="12" dy="18" stdDeviation="7" flood-color="#000" flood-opacity=".9"/><feDropShadow dx="0" dy="0" stdDeviation="2" flood-color="#70f5ff" flood-opacity=".7"/></filter>
    <filter id="yellowDepth" x="-30%" y="-30%" width="180%" height="180%"><feDropShadow dx="13" dy="19" stdDeviation="7" flood-color="#000" flood-opacity=".9"/><feDropShadow dx="0" dy="0" stdDeviation="3" flood-color="#ffcf00" flood-opacity=".75"/></filter>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <clipPath id="clip"><circle cx="360" cy="360" r="333"/></clipPath>
    <style>
      #atom{transform-origin:207px 193px;animation:atomSpin 8s linear infinite}#electron-a{animation:pulse 1.8s ease-in-out infinite}#electron-b{animation:pulse 1.8s .6s ease-in-out infinite}#flask{transform-origin:380px 168px;animation:flaskBob 4.5s ease-in-out infinite}#liquid{animation:liquid 3s ease-in-out infinite}#bubble-1{animation:bubble 2.4s ease-in infinite}#bubble-2{animation:bubble 2.4s .8s ease-in infinite}#bubble-3{animation:bubble 2.4s 1.5s ease-in infinite}#book{transform-origin:360px 610px;animation:bookLift 4s ease-in-out infinite}#left-pages,#right-pages{transform-box:fill-box}#left-pages{transform-origin:right bottom;animation:leftPage 4.8s ease-in-out infinite}#right-pages{transform-origin:left bottom;animation:rightPage 4.8s 2.4s ease-in-out infinite}#page-spark{animation:pageSpark 2.4s ease-in-out infinite}#science,#squad{transform-box:fill-box;transform-origin:center;animation:name 5s ease-in-out infinite}#squad{animation-delay:.2s}.molecule{animation:moleculePulse 3.2s ease-in-out infinite}.molecule.right{animation-delay:-1.3s}#badge-glint{animation:glint 5s ease-in-out infinite}
      @keyframes atomSpin{from{transform:translate(135px,128px) rotate(0)}to{transform:translate(135px,128px) rotate(360deg)}}@keyframes pulse{50%{opacity:.55;transform:scale(.88)}}@keyframes flaskBob{0%,100%{transform:translate(300px,56px)}50%{transform:translate(300px,47px) rotate(2deg)}}@keyframes liquid{50%{transform:translateY(4px) skewX(-4deg)}}@keyframes bubble{0%{opacity:0;transform:translateY(18px) scale(.5)}45%{opacity:1}100%{opacity:0;transform:translateY(-30px) scale(1.15)}}@keyframes bookLift{0%,100%{transform:translate(244px,520px)}50%{transform:translate(244px,512px) scale(1.035)}}@keyframes leftPage{0%,18%,100%{transform:perspective(280px) rotateY(0) skewY(0)}38%,48%{transform:perspective(280px) rotateY(-38deg) skewY(-5deg)}62%{transform:perspective(280px) rotateY(-10deg)}}@keyframes rightPage{0%,18%,100%{transform:perspective(280px) rotateY(0) skewY(0)}38%,48%{transform:perspective(280px) rotateY(38deg) skewY(5deg)}62%{transform:perspective(280px) rotateY(10deg)}}@keyframes pageSpark{0%,100%{opacity:.18;transform:translateX(-12px)}50%{opacity:1;transform:translateX(16px)}}@keyframes moleculePulse{50%{opacity:.55}}@keyframes name{50%{transform:translateY(-3px)}}@keyframes glint{0%,18%,100%{opacity:0;transform:translateX(-160px) rotate(-18deg)}36%,48%{opacity:.52}70%{opacity:0;transform:translateX(210px) rotate(-18deg)}}
      @media(prefers-reduced-motion:reduce){*{animation:none!important}}
    </style>
  </defs>
  <g filter="url(#deep)"><circle cx="360" cy="360" r="333" fill="url(#badge)" stroke="#00dfff" stroke-width="7"/><circle cx="360" cy="360" r="320" fill="none" stroke="#ffe000" stroke-opacity=".72" stroke-width="3"/><circle cx="360" cy="360" r="311" fill="none" stroke="#25eaff" stroke-opacity=".3" stroke-width="2"/></g>
  <g clip-path="url(#clip)">
    <ellipse id="badge-glint" cx="250" cy="172" rx="72" ry="390" fill="url(#badgeShine)" transform="rotate(-18 250 172)"/>
    <g id="atom" transform="translate(135 128)" fill="none" stroke="#f8fafc" stroke-width="9" filter="url(#glow)"><ellipse cx="72" cy="65" rx="72" ry="27"/><ellipse cx="72" cy="65" rx="72" ry="27" transform="rotate(60 72 65)"/><ellipse cx="72" cy="65" rx="72" ry="27" transform="rotate(-60 72 65)"/><circle cx="72" cy="65" r="16" fill="url(#cyan)" stroke="#071633" stroke-width="5"/><circle id="electron-a" cx="142" cy="65" r="7" fill="#ffd51f" stroke="none"/><circle id="electron-b" cx="38" cy="9" r="6" fill="#ff4f9a" stroke="none"/></g>
    <g id="flask" transform="translate(300 56)" filter="url(#deep)"><path d="M43 8h74v20H99v66l54 98c9 17-2 31-22 31H29c-20 0-31-14-22-31l54-98V28H43Z" fill="url(#paper)" stroke="#08142a" stroke-width="8"/><path id="liquid" d="M33 160c25 12 45-13 72 0 12 6 24 5 35 0l25 47H-1Z" fill="url(#cyan)" stroke="#083351" stroke-width="6"/><path d="M62 61h37" stroke="#7e91a8" stroke-width="6" stroke-linecap="round"/><circle id="bubble-1" cx="92" cy="142" r="8" fill="#fff"/><circle id="bubble-2" cx="119" cy="152" r="6" fill="#d9fbff"/><circle id="bubble-3" cx="72" cy="160" r="5" fill="#fff"/></g>
    <g fill="url(#cyan)" filter="url(#glow)"><circle cx="535" cy="94" r="11"/><circle cx="566" cy="118" r="7"/><circle cx="591" cy="85" r="8"/><circle cx="612" cy="129" r="13"/><circle cx="548" cy="151" r="6"/></g>
    <g id="science" filter="url(#textDepth)"><text x="372" y="358" text-anchor="middle" font-family="Arial Black,Arial,sans-serif" font-size="102" font-weight="900" letter-spacing="-5" fill="#062e58" stroke="#001126" stroke-width="5">SCIENCE</text><text x="366" y="350" text-anchor="middle" font-family="Arial Black,Arial,sans-serif" font-size="102" font-weight="900" letter-spacing="-5" fill="#159ac1" stroke="#062f59" stroke-width="4">SCIENCE</text><text x="360" y="342" text-anchor="middle" font-family="Arial Black,Arial,sans-serif" font-size="102" font-weight="900" letter-spacing="-5" fill="#fff" stroke="#d8fbff" stroke-width="3" paint-order="stroke">SCIENCE</text><path d="M89 275l-33-23M80 310l-43-2M91 345l-31 21M628 275l33-23M639 310l43-2M628 345l31 21" stroke="#18eaff" stroke-width="10" stroke-linecap="round"/></g>
    <g id="squad" filter="url(#yellowDepth)"><text x="373" y="481" text-anchor="middle" font-family="Arial Black,Arial,sans-serif" font-size="126" font-weight="900" font-style="italic" letter-spacing="-9" fill="#6d2800" stroke="#321000" stroke-width="6">SQUAD</text><text x="367" y="472" text-anchor="middle" font-family="Arial Black,Arial,sans-serif" font-size="126" font-weight="900" font-style="italic" letter-spacing="-9" fill="#e37b00" stroke="#8b3b00" stroke-width="4">SQUAD</text><text x="360" y="463" text-anchor="middle" font-family="Arial Black,Arial,sans-serif" font-size="126" font-weight="900" font-style="italic" letter-spacing="-9" fill="url(#yellow)" stroke="#fff46a" stroke-width="3" paint-order="stroke">SQUAD</text><path d="M184 489c116 20 237 13 357-12" fill="none" stroke="#fff" stroke-width="13" stroke-linecap="round"/><path d="M197 502c108 14 221 8 329-10" fill="none" stroke="#00cdec" stroke-width="7" stroke-linecap="round"/></g>
    <g id="book" transform="translate(244 520)" filter="url(#deep)"><g id="left-pages"><path d="M116 32C82 5 39 4 8 18v118c37-12 73-4 108 24Z" fill="url(#paperTurn)" stroke="#031226" stroke-width="8"/><path d="M28 48c26-6 49-1 70 13M28 72c26-6 49-1 70 13M28 96c26-6 49-1 70 13" fill="none" stroke="#397da8" stroke-width="5" stroke-linecap="round"/></g><g id="right-pages"><path d="M116 32c34-27 77-28 108-14v118c-37-12-73-4-108 24Z" fill="url(#paper)" stroke="#031226" stroke-width="8"/><path d="M204 48c-26-6-49-1-70 13M204 72c-26-6-49-1-70 13M204 96c-26-6-49-1-70 13" fill="none" stroke="#397da8" stroke-width="5" stroke-linecap="round"/></g><path d="M116 34v126" stroke="#005b89" stroke-width="7"/><path id="page-spark" d="M105 43v101" stroke="#fff" stroke-width="4" stroke-linecap="round" opacity=".6"/></g>
    <g class="molecule" transform="translate(95 545)" stroke="#ff4f9a" stroke-width="9" fill="#ff4f9a" filter="url(#glow)"><path d="m25 25 45 35-20 46M70 60l47-30M70 60l46 48" fill="none"/><circle cx="25" cy="25" r="13"/><circle cx="70" cy="60" r="16"/><circle cx="50" cy="106" r="12"/><circle cx="117" cy="30" r="13"/><circle cx="116" cy="108" r="12"/></g>
    <g class="molecule right" transform="translate(520 548)" stroke="#7dff2a" stroke-width="9" fill="#7dff2a" filter="url(#glow)"><path d="m25 25 45 35-20 46M70 60l47-30M70 60l46 48" fill="none"/><circle cx="25" cy="25" r="13"/><circle cx="70" cy="60" r="16"/><circle cx="50" cy="106" r="12"/><circle cx="117" cy="30" r="13"/><circle cx="116" cy="108" r="12"/></g>
  </g>
</svg>
