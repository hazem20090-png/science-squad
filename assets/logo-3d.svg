<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 720" role="img" aria-labelledby="title desc">
  <title id="title">Science Squad animated 3D logo</title>
  <desc id="desc">شعار Science Squad ثلاثي الأبعاد مع ذرة ودورق وكتاب متحرك</desc>
  <defs>
    <radialGradient id="badge" cx="48%" cy="40%" r="65%"><stop stop-color="#102650"/><stop offset=".58" stop-color="#071633"/><stop offset="1" stop-color="#020714"/></radialGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#7df4ff"/><stop offset=".48" stop-color="#10cceb"/><stop offset="1" stop-color="#087ea6"/></linearGradient>
    <linearGradient id="yellow" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#fff376"/><stop offset=".42" stop-color="#ffd51f"/><stop offset="1" stop-color="#e19b00"/></linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#fff"/><stop offset="1" stop-color="#c7d6e8"/></linearGradient>
    <filter id="deep" x="-40%" y="-40%" width="180%" height="180%"><feDropShadow dx="0" dy="16" stdDeviation="13" flood-color="#000" flood-opacity=".8"/><feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#12c9e8" flood-opacity=".24"/></filter>
    <filter id="textDepth" x="-30%" y="-30%" width="180%" height="180%"><feDropShadow dx="3" dy="4" stdDeviation="0" flood-color="#7f93ad"/><feDropShadow dx="7" dy="9" stdDeviation="0" flood-color="#263b59"/><feDropShadow dx="12" dy="16" stdDeviation="5" flood-color="#000" flood-opacity=".75"/></filter>
    <filter id="yellowDepth" x="-30%" y="-30%" width="180%" height="180%"><feDropShadow dx="3" dy="4" stdDeviation="0" flood-color="#f19c00"/><feDropShadow dx="8" dy="10" stdDeviation="0" flood-color="#745000"/><feDropShadow dx="12" dy="17" stdDeviation="6" flood-color="#000" flood-opacity=".75"/></filter>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <clipPath id="clip"><circle cx="360" cy="360" r="333"/></clipPath>
    <style>
      #atom{transform-origin:207px 193px;animation:atomSpin 8s linear infinite}#electron-a{animation:pulse 1.8s ease-in-out infinite}#electron-b{animation:pulse 1.8s .6s ease-in-out infinite}#flask{transform-origin:380px 168px;animation:flaskBob 4.5s ease-in-out infinite}#liquid{animation:liquid 3s ease-in-out infinite}#bubble-1{animation:bubble 2.4s ease-in infinite}#bubble-2{animation:bubble 2.4s .8s ease-in infinite}#bubble-3{animation:bubble 2.4s 1.5s ease-in infinite}#book{transform-origin:360px 610px;animation:bookLift 4s ease-in-out infinite}#science,#squad{transform-box:fill-box;transform-origin:center;animation:name 5s ease-in-out infinite}#squad{animation-delay:.2s}.molecule{animation:moleculePulse 3.2s ease-in-out infinite}.molecule.right{animation-delay:-1.3s}
      @keyframes atomSpin{from{transform:translate(135px,128px) rotate(0)}to{transform:translate(135px,128px) rotate(360deg)}}@keyframes pulse{50%{opacity:.55;transform:scale(.88)}}@keyframes flaskBob{0%,100%{transform:translate(300px,56px)}50%{transform:translate(300px,47px) rotate(2deg)}}@keyframes liquid{50%{transform:translateY(4px) skewX(-4deg)}}@keyframes bubble{0%{opacity:0;transform:translateY(18px) scale(.5)}45%{opacity:1}100%{opacity:0;transform:translateY(-30px) scale(1.15)}}@keyframes bookLift{0%,100%{transform:translate(244px,520px)}50%{transform:translate(244px,513px) scale(1.025)}}@keyframes moleculePulse{50%{opacity:.55}}@keyframes name{50%{transform:translateY(-3px)}}
      @media(prefers-reduced-motion:reduce){*{animation:none!important}}
    </style>
  </defs>
  <g filter="url(#deep)"><circle cx="360" cy="360" r="333" fill="url(#badge)" stroke="#163b72" stroke-width="5"/><circle cx="360" cy="360" r="315" fill="none" stroke="#12c9e8" stroke-opacity=".16" stroke-width="2"/></g>
  <g clip-path="url(#clip)">
    <g id="atom" transform="translate(135 128)" fill="none" stroke="#f8fafc" stroke-width="9" filter="url(#glow)"><ellipse cx="72" cy="65" rx="72" ry="27"/><ellipse cx="72" cy="65" rx="72" ry="27" transform="rotate(60 72 65)"/><ellipse cx="72" cy="65" rx="72" ry="27" transform="rotate(-60 72 65)"/><circle cx="72" cy="65" r="16" fill="url(#cyan)" stroke="#071633" stroke-width="5"/><circle id="electron-a" cx="142" cy="65" r="7" fill="#ffd51f" stroke="none"/><circle id="electron-b" cx="38" cy="9" r="6" fill="#ff4f9a" stroke="none"/></g>
    <g id="flask" transform="translate(300 56)" filter="url(#deep)"><path d="M43 8h74v20H99v66l54 98c9 17-2 31-22 31H29c-20 0-31-14-22-31l54-98V28H43Z" fill="url(#paper)" stroke="#08142a" stroke-width="8"/><path id="liquid" d="M33 160c25 12 45-13 72 0 12 6 24 5 35 0l25 47H-1Z" fill="url(#cyan)" stroke="#083351" stroke-width="6"/><path d="M62 61h37" stroke="#7e91a8" stroke-width="6" stroke-linecap="round"/><circle id="bubble-1" cx="92" cy="142" r="8" fill="#fff"/><circle id="bubble-2" cx="119" cy="152" r="6" fill="#d9fbff"/><circle id="bubble-3" cx="72" cy="160" r="5" fill="#fff"/></g>
    <g fill="url(#cyan)" filter="url(#glow)"><circle cx="535" cy="94" r="11"/><circle cx="566" cy="118" r="7"/><circle cx="591" cy="85" r="8"/><circle cx="612" cy="129" r="13"/><circle cx="548" cy="151" r="6"/></g>
    <g id="science" filter="url(#textDepth)"><text x="360" y="342" text-anchor="middle" font-family="Arial Black,Arial,sans-serif" font-size="102" font-weight="900" letter-spacing="-5" fill="#f8fafc" stroke="#f8fafc" stroke-width="3" paint-order="stroke">SCIENCE</text><path d="M89 275l-33-23M80 310l-43-2M91 345l-31 21M628 275l33-23M639 310l43-2M628 345l31 21" stroke="#12c9e8" stroke-width="10" stroke-linecap="round"/></g>
    <g id="squad" filter="url(#yellowDepth)"><text x="360" y="463" text-anchor="middle" font-family="Arial Black,Arial,sans-serif" font-size="126" font-weight="900" font-style="italic" letter-spacing="-9" fill="url(#yellow)" stroke="#ffd51f" stroke-width="3" paint-order="stroke">SQUAD</text><path d="M184 489c116 20 237 13 357-12" fill="none" stroke="#f8fafc" stroke-width="13" stroke-linecap="round"/><path d="M197 502c108 14 221 8 329-10" fill="none" stroke="#405b7d" stroke-width="7" stroke-linecap="round"/></g>
    <g id="book" transform="translate(244 520)" filter="url(#deep)"><path d="M116 32C82 5 39 4 8 18v118c37-12 73-4 108 24Z" fill="url(#paper)" stroke="#07142b" stroke-width="8"/><path d="M116 32c34-27 77-28 108-14v118c-37-12-73-4-108 24Z" fill="url(#paper)" stroke="#07142b" stroke-width="8"/><path d="M116 34v126" stroke="#6e829c" stroke-width="6"/><path d="M28 48c26-6 49-1 70 13M28 72c26-6 49-1 70 13M28 96c26-6 49-1 70 13M204 48c-26-6-49-1-70 13M204 72c-26-6-49-1-70 13M204 96c-26-6-49-1-70 13" fill="none" stroke="#71849a" stroke-width="5" stroke-linecap="round"/></g>
    <g class="molecule" transform="translate(95 545)" stroke="#ff4f9a" stroke-width="9" fill="#ff4f9a" filter="url(#glow)"><path d="m25 25 45 35-20 46M70 60l47-30M70 60l46 48" fill="none"/><circle cx="25" cy="25" r="13"/><circle cx="70" cy="60" r="16"/><circle cx="50" cy="106" r="12"/><circle cx="117" cy="30" r="13"/><circle cx="116" cy="108" r="12"/></g>
    <g class="molecule right" transform="translate(520 548)" stroke="#7dff2a" stroke-width="9" fill="#7dff2a" filter="url(#glow)"><path d="m25 25 45 35-20 46M70 60l47-30M70 60l46 48" fill="none"/><circle cx="25" cy="25" r="13"/><circle cx="70" cy="60" r="16"/><circle cx="50" cy="106" r="12"/><circle cx="117" cy="30" r="13"/><circle cx="116" cy="108" r="12"/></g>
  </g>
</svg>
